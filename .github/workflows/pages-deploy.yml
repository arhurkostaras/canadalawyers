name: pages-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Arthur's checklist: pages + id-token are the two scopes deploy-pages needs;
# default token scopes bit this repo before (secret-scan 403s on PR events).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
